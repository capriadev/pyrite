# Docker Compose - Pyrite
# Contenedor `pyrite` con instancias internas (Postgres + Redis).
# Pyrite port block: 300xx (prod). Postgres host 30010, Redis host 30011.
name: pyrite

services:
  postgres:
    image: postgres:17
    container_name: pyrite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyrite
      POSTGRES_PASSWORD: pyrite
      POSTGRES_DB: pyrite
    ports:
      - "30010:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrite -d pyrite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pyrite-redis
    restart: unless-stopped
    ports:
      - "30011:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    external: true
    name: docker_postgres-data
  redis-data:
    external: true
    name: docker_redis-data