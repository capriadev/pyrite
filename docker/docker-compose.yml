# Docker Compose - Pyrite
# Contenedor `pyrite` con instancias internas (Postgres + Redis).
# El backend (apps/api) corre apuntando a estos servicios.

services:
  postgres:
    image: postgres:17
    container_name: pyrite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyrite
      POSTGRES_PASSWORD: pyrite
      POSTGRES_DB: pyrite
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrite -d pyrite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pyrite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data: